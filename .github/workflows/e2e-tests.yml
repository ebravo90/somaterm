name: E2E Tests (Hybrid)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  actions: write
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install Node dependencies
        run: npm install
      - name: Run Static Analysis
        run: npm run lint && npx tsc -b
      - name: Fail Fast (Cancel Run)
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  mocked-ui-tests:
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install Node dependencies
        run: npm install
      - name: Run WebdriverIO E2E Local/Mocked Tests
        run: |
          npm run dev:mock &
          sleep 5
          npm run test:e2e:local
      - name: Fail Fast (Cancel Run)
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

  native-tests:
    needs: mocked-ui-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'
      - name: Install Tauri dependencies (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev webkit2gtk-driver build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - name: Install Tauri Driver
        run: cargo install tauri-driver
      - name: Install Node dependencies
        run: npm install
      - name: Build UI and Tauri Binary
        run: |
          npm run build
          cd src-tauri && cargo build
      - name: Run WebdriverIO E2E Native Tests
        run: WEBKIT_DISABLE_COMPOSITING_MODE=1 xvfb-run npm run test:e2e:ci
      - name: Fail Fast (Cancel Run)
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

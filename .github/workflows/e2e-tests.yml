name: E2E Tests (Hybrid)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Run WebdriverIO E2E Local/Mocked Tests
        run: |
          npm run dev:mock &
          sleep 5
          npm run test:e2e:local

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Tauri dependencies (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb

      - name: Install Tauri Driver
        run: cargo install tauri-driver

      - name: Install Node dependencies
        run: npm ci

      - name: Build UI and Tauri Binary
        run: npm run build

      - name: Run WebdriverIO E2E Native Tests
        run: xvfb-run npm run test:e2e:ci

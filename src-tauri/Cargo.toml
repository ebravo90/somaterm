[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["macos-private-api", "unstable"] }
tauri-plugin-log = "2"
portable-pty = "0.8.1"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
urlencoding = "2.1.3"
keyring = "3.6.3"
hex = "0.4.3"
tauri-plugin-process = "2"
tauri-plugin-store = "2.4.4"
tauri-plugin-dialog = "2.0.0-rc.3"
ignore = "0.4.30"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "migrate"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3.27.0"
